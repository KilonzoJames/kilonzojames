# Generates profile chart SVGs and commits them to this repo.
# README embeds the local files so the profile does not depend on
# live third-party image hosts (which rate-limit or go down).
#
# Does this create a GitHub Actions artifact?
#   No. It writes SVG files into the repository and commits them.
#   It does not use actions/upload-artifact.
#
# Commits: one bot commit when any generated SVG changes.
# Schedule: every 3 months (1 Jan / 1 Apr / 1 Jul / 1 Oct), plus manual runs.
#
# Setup (once):
#   1. Create a classic PAT with `repo` + `read:user` scopes
#      https://github.com/settings/tokens
#   2. Add it as repo secret SUMMARY_GITHUB_TOKEN
#   3. Actions → Profile Summary Cards → Run workflow
#
# Outputs:
#   profile-summary-card-output/nord_dark/*.svg

name: Profile Summary Cards

on:
  schedule:
    # 00:00 UTC on the 1st day of every 3rd month
    - cron: "0 0 1 */3 *"
  workflow_dispatch:

concurrency:
  group: profile-summary-cards
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      CHARTS_DIR: profile-summary-card-output/nord_dark

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUMMARY_GITHUB_TOKEN }}

      - name: Generate summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 3
          THEME: nord_dark
          AUTO_PUSH: false

      - name: Fetch streak and activity graph SVGs
        run: |
          set -euo pipefail
          mkdir -p "$CHARTS_DIR"

          # Try each host until one returns an SVG.
          # streak: demolab is the project homepage; Heroku is unpaid and sometimes returns 402.
          # activity: github-readme-activity-graph.vercel.app is paused (402 DEPLOYMENT_DISABLED).
          fetch_svg() {
            local dest="$1"
            shift
            local url
            for url in "$@"; do
              echo "Fetching $(basename "$dest")"
              if curl -fsSL --retry 2 --retry-delay 2 "$url" -o "$dest" && grep -q '<svg' "$dest"; then
                return 0
              fi
              echo "::warning::No SVG from $url"
              rm -f "$dest"
            done
            echo "::error::Expected SVG content in $dest"
            return 1
          }

          fetch_svg "$CHARTS_DIR/5-streak.svg" \
            "https://streak-stats.demolab.com/?user=kilonzojames&theme=nord_dark&hide_border=true&background=2E3440&ring=88C0D0&fire=88C0D0&currStreakLabel=88C0D0&sideLabels=ECEFF4&currStreakNum=ECEFF4&sideNums=ECEFF4&dates=D8DEE9" \
            "https://github-readme-streak-stats.herokuapp.com/?user=kilonzojames&theme=nord_dark&hide_border=true&background=2E3440&ring=88C0D0&fire=88C0D0&currStreakLabel=88C0D0&sideLabels=ECEFF4&currStreakNum=ECEFF4&sideNums=ECEFF4&dates=D8DEE9"

          fetch_svg "$CHARTS_DIR/6-activity-graph.svg" \
            "https://github-readme-activity-graphkayan.vercel.app/graph?username=kilonzojames&bg_color=2E3440&color=D8DEE9&line=88C0D0&point=ECEFF4&area=true&area_color=5E81AC&hide_border=true&height=240"

      - name: Commit and push chart SVGs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile-summary-card-output/
          if git diff --cached --quiet; then
            echo "No chart changes to commit."
            exit 0
          fi

          git commit -m "chore: refresh profile chart SVGs"
          git push
